# FLAT-20: thenewwazoo/FLAT-20 (0c96ea5, 0.3.2), a Korg MS-20 modelled part by part, on Dinghy (take.py)
name = FLAT20
version = 1
# the FPU, as FLAT-20 builds itself (its single-precision floats in the general registers: nothing more to save in
# the audio interrupt); -Os, as it builds (its own note: -O2 grew it and ran slower)
cflags = -mcpu=r3 -mfprev1 -ffp-contract=off -Imodules/flat20/flat20 -Os -Wno-initializer-overrides
