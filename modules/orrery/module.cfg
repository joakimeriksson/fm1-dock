# ORRERY: the seventies' synths of a Jarre record in one module (orrery-fm1; written by take.py from its
# module.cfg: the ARP 2600, the Eminent and the Mini Pops are this tree's own modules' engines)
name = ORRERY
version = 2
sources = orrery/module/band.c orrery/module/orrery.c orrery/module/seq.c orrery/instruments/electronic_fx.c orrery/instruments/ensemble.c orrery/engines/ens_engine.c orrery/instruments/synthex.c orrery/instruments/synthex_synth.c orrery/instruments/synthex_voice.c orrery/core/session.c orrery/core/commands.c orrery/core/mixer.c orrery/core/effect.c orrery/core/router.c orrery/core/instrument.c orrery/core/transport.c orrery/instruments/arp.c orrery/instruments/eminent.c orrery/instruments/minipops.c orrery/effects/filter.c orrery/effects/phaser.c orrery/effects/echo.c orrery/effects/reverb.c orrery/effects/registry.c ../arp2600/arp_engine.c ../eminent/em_engine.c ../minipops/mp_engine.c
cflags = -O2 -std=c11 -DMD_SINGLE_CORE -DMD_HOT_SECTION=".ram_text.md" -Imodules/orrery/orrery -Imodules/orrery/orrery/module -Imodules/orrery/orrery/engines -Imodules/arp2600 -Imodules/eminent -Imodules/minipops
cflags ../arp2600/arp_engine.c = -DARP_HOT=__attribute__((section(".ram_text.arp")))
cflags ../eminent/em_engine.c = -DEM_HOT=__attribute__((section(".ram_text.em")))
cflags ../minipops/mp_engine.c = -DMP_HOT=__attribute__((section(".ram_text.mp")))
