# FM6: keremimo/melodee 165d177 (main), Kerem Kilic's six-operator FM engine (take.py), on fm1-dock's host
name = FM6
version = 1
# the FPU, as Melodee builds its firmware (fp32 in the general registers; no fused multiply-add on the device)
cflags = -mcpu=r3 -mfprev1 -ffp-contract=off -Werror=double-promotion -Imodules/fm6/melodee
