# FIMBA: jadamsowers/fm1-fimba (0485ed0, 0.6.1), FiMba-1, a kalimba by modal synthesis (take.py)
name = FIMBA
version = 1
sources = fimba/dsp/kalimba.c
# the FPU, as FiMba-1 builds itself (its single-precision floats in the general registers: nothing more to save in
# the audio interrupt)
cflags = -mcpu=r3 -mfprev1 -ffp-contract=off -Imodules/fimba/fimba -Imodules/fimba/fimba/app -Imodules/fimba/fimba/dsp
