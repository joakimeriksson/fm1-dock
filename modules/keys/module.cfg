# KEYS: a clavinet, an electric piano and a piano from physical models (keys_dsp.h), with parts of Mutable Instruments'
# Plaits and stmlib (keys_mi.h, MIT: LICENSE-MIT-Plaits)
name = KEYS
version = 1
# the FPU (fp32 in the general registers: nothing more to save in the audio interrupt; no fused multiply-add)
cflags = -O2 -mcpu=r3 -mfprev1 -ffp-contract=off -Werror=double-promotion
