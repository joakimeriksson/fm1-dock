# DUB-1: sbegueria/fm1-dub (501c4cf), a dub techno machine, AMB-1's fork (take.py)
name = DUB-1
version = 1
sources = dub/dsp/amb.c
# the FPU, as DUB-1 builds itself (its single-precision floats in the general registers: nothing more to save in the
# audio interrupt); its UI -Os and its engine -O2, as DUB-1 builds them; the tape loop 4.2 s (5.6 in DUB-1: the
# longest echo, a bar, doubled down to 115 BPM, Haze's 116) and the plate in 16 bits, for a module's RAM (take.py)
cflags = -mcpu=r3 -mfprev1 -ffp-contract=off -Imodules/dub/dub -Imodules/dub/dub/app -Imodules/dub/dub/dsp -DTAPE_N=46000 -DPL_Q=8192 -Os
cflags dub/dsp/amb.c = -O2
