# FW_HOST: GATOR's own switch (its host simulator's) for what a module needs too: no .pool section (a module's RAM is
# one region the host clears) and libc.c without memset / memcpy / memcmp (modules/lib/hb_lib.c has them).
# FW_FS48 0: the codec's 44.1 kHz family, as the host runs it (192 MHz / 17 / 256 = 44117.6 Hz: Plaits' kSampleRate)
# -Os: GATOR builds its C (the app) for size, its C++ (below) -O2
cflags = -Os -DFW_HOST -DFW_FS48=0 -Imodules/gator/gator
# GATOR's C++ flags (its tools/build.py): the FPU, Plaits' portable code (TEST), no exceptions, RTTI or static
# constructors; -fhosted -fbuiltin undo the modules' -ffreestanding for C++ alone, so fabsf is an instruction again
cxxflags = -O2 -mcpu=r3 -mfprev1 -std=gnu++11 -DTEST -fno-math-errno -fno-exceptions -fno-rtti -fno-threadsafe-statics -fno-use-cxa-atexit -nostdinc++ -fhosted -fbuiltin -Wno-unused-variable -Wno-unused-local-typedef -Imodules/gator/gator/cxx -Imodules/gator/gator/eurorack
libs = m
