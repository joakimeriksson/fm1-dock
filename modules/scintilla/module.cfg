# SCINTILLA: joakimeriksson/scintilla-fm1, the Elka Synthex engine (take.py)
name = SCINTILLA
version = 7
sources = engine/sc_synth.c engine/sc_voice.c
# the app -Os; the engine -O2 and without SC_SMALL_OSC, as the standalone firmware builds it: in fm1-emu's strict
# timing (measured costs, the flash cache) -Os outlines svf_pass / sc_pitch_inc (a call a sample) and SC_SMALL_OSC
# runs every oscillator through the synced loop: 10-18 % of a block more on one core (+6 KB of code here)
cflags = -Imodules/scintilla/engine -Imodules/scintilla -DHB_MODULE -DSC_LANES=2 -Os
cflags engine/sc_voice.c = -O2
cflags engine/sc_synth.c = -O2
