# SCINTILLA: joakimeriksson/scintilla-fm1, the Elka Synthex engine (take.py)
name = SCINTILLA
version = 3
sources = engine/sc_synth.c engine/sc_voice.c
cflags = -Imodules/scintilla/engine -Imodules/scintilla -DHB_MODULE -DSC_SMALL_OSC -DSC_LANES=2 -Os
# the voices' render in RAM (tools/hbmod.py: ram_text), away from the flash cache: sc_render_voices (called
# through HB_FAR, sc_harbor.h) and all it calls
ram_text = sc_render_voices sc_voice_render_lane osc_run osc_tick osc_saw osc_triangle osc_square osc_sine cut_eval lfo_cut_dmax update_coeffs sc_pitch_inc env_run svf_pass max_step
