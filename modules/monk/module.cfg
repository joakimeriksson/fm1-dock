# MONK-1: charlesvestal/fm1-monk (a9d368a), Charles Vestal's twelve singers on MonkSynth's voice (take.py)
name = MONK-1
version = 1
sources = monk/dsp/monk.c
# the FPU, as MONK-1 builds itself (its single-precision floats in the general registers: nothing more to save in the
# audio interrupt)
cflags = -mcpu=r3 -mfprev1 -ffp-contract=off -Imodules/monk/monk -Imodules/monk/monk/app -Imodules/monk/monk/dsp
