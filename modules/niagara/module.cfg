# NIAGARA: evanyerburgh/niagara-drift (86f47d2, v0.2.1), Evan Yerburgh's drone synth (take.py)
name = NIAGARA
version = 1
sources = niagara/dsp/drone.c
# the FPU, as Niagara Drift builds itself (its single-precision floats in the general registers: nothing more to save
# in the audio interrupt); its UI -Os and its engine -O2, as Niagara Drift builds them
cflags = -mcpu=r3 -mfprev1 -ffp-contract=off -Imodules/niagara/niagara -Imodules/niagara/niagara/app -Imodules/niagara/niagara/dsp -Os
cflags niagara/dsp/drone.c = -O2
