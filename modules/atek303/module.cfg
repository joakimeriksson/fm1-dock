# ATEK303: animatek/FM1-Animatek 564b7a0 (ATEK303 1.2), Animatek's acid machine on fm1-base (take.py)
name = ATEK303
version = 1
sources = atek303/dsp/atek_voice.c atek303/dsp/acid_pattern.c atek303/dsp/fx.c

# the FPU, as fm1-base builds ATEK303 (its single-precision floats in the general registers: nothing more to save in
# the audio interrupt); its UI -Os and its engine -O2, as fm1-base builds them (fm1.toml o2); for a module's RAM, the
# plate in 16 bits and the canvas 240 x 124 (take.py)
cflags = -mcpu=r3 -mfprev1 -ffp-contract=off -Imodules/atek303/atek303 -Imodules/atek303/atek303/dsp -DFX_RV_Q=8192 -DAPP_CANVAS_PX=29760u -Os
cflags atek303/dsp/atek_voice.c = -O2
cflags atek303/dsp/acid_pattern.c = -O2
cflags atek303/dsp/fx.c = -O2
